name: Cross-Platform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version tag (e.g. v1.0.0) to publish a GitHub Release; leave blank to only build & verify artifacts"
        type: string
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            ext: ""
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            ext: ""
            timeout_minutes: 55
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - runner: windows-2022
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            target: aarch64-pc-windows-msvc
            ext: ".exe"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'

      - name: Verify native Rust toolchain
        run: |
          rustup show
          actual_target=$(rustc --version --verbose | awk '/^host: / { print $2 }' | tr -d '\r')
          echo "Host target: ${actual_target}"
          test "${actual_target}" = "${{ matrix.target }}"

      - name: Run tests
        run: |
          cargo test --locked -p omp-toolkit -p omp-minimizer -p omp-diff -p omp-xfs -p omp-vfs
          cargo test --locked -p omp-ast --no-default-features

      - name: Build release single binary
        run: cargo build --locked --release --bin omp-toolkit

      - name: Smoke test & package artifact
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          bin="target/release/omp-toolkit${EXT}"
          "$bin" --version
          "$bin" setup --client list
          "$bin" conflicts scan >/dev/null

          pkg_name="omp-toolkit-${TARGET}"
          stage="target/dist/${pkg_name}"
          mkdir -p "$stage"
          cp "$bin" "$stage/omp-toolkit${EXT}"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md README.zh-CN.md "$stage/"

          mkdir -p target/release-artifacts
          if [[ "$PLATFORM" == "win32" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${stage}' -DestinationPath 'target/release-artifacts/${pkg_name}.zip' -Force"
          else
            tar -C target/dist -czf "target/release-artifacts/${pkg_name}.tar.gz" "${pkg_name}"
          fi
          ls -lh target/release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/release-artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum omp-toolkit-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "OMP Toolkit $TAG" \
            --generate-notes
