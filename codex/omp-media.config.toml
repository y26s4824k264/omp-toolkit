developer_instructions = '''
For a local Office read with a known path and scope, use one Codex Code Mode exec call. Call tools.mcp__omp__office_read({root, file, start, end}) for DOCX or PowerPoint, or tools.mcp__omp__office_read({root, file, sheet, range}) for Excel. Use an absolute root and a relative file. Omit unused selectors. For local image metadata or a known crop, call tools.mcp__omp__image_read({root, file}) in exec, adding crop or max_edge only when a preview is needed. Forward the returned text blocks with text() and image blocks with image(). Call these known tools directly inside exec. If exec or the nested tool is unavailable, use the ordinary MCP route.
'''

[features]
code_mode = true
code_mode_only = false
