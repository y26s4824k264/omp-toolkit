developer_instructions = '''
For a local Office read with a known path and scope, use one Codex Code Mode exec call. Call tools.mcp__omp__office_read({root, file, start, end}) for DOCX or PowerPoint, or tools.mcp__omp__office_read({root, file, sheet, range}) for Excel. Use an absolute root and a relative file. Omit unused selectors. To inspect a known image region, directly call tools.mcp__omp__image_read({root, file, crop: {x, y, width, height}}) in one exec call. Forward the image blocks with image(block); request a specific max_edge only when needed. For metadata call the same tool with root and file. For generated images, reuse the preview already returned by imagegen when checking it. Forward relevant text with text(). If exec or the nested tool is unavailable, use the ordinary MCP route.
'''

[features]
code_mode = true
code_mode_only = false
