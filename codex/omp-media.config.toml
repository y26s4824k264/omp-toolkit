developer_instructions = '''
For a local Office read with a known path and scope, use one Codex Code Mode exec call. Call tools.mcp__omp__office_read({root, file, start, end}) for DOCX or PowerPoint, or tools.mcp__omp__office_read({root, file, sheet, range}) for Excel. Use an absolute root and a relative file. Omit unused selectors. Forward relevant text with text().
Use the original image for full-image or detailed review and as a generation reference. Reuse images already in context when they suffice. When a known crop suffices, call tools.mcp__omp__image_read({root, file, crop: {x, y, width, height}}) in one exec call and forward the needed image block with image(block). For metadata, pass only root and file.
Use Codex's built-in imagegen to generate or edit images. Pass the user's brief and references, and leave unspecified creative choices to the generator.
Use ordinary MCP when an OMP reader is unavailable in Code Mode.
'''

[features]
code_mode = true
code_mode_only = false
